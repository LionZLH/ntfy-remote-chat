name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]  # Windows 额外测 3.10-3.12
        include:
          - os: windows-latest
            python: "3.10"
          - os: windows-latest
            python: "3.11"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Daemon smoke test (install service, phone command, uninstall)
        if: always()
        run: python tests/smoke_daemon.py
      - name: Live test against ntfy.sh (burst + catch-up)
        if: always()
        run: python tests/live_burst.py
